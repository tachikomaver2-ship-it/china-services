<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; }
  .wrap {
    width:600px; height:600px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(120% 120% at 50% 18%, #43e0cf 0%, #12b6c6 40%, #0c7d99 74%, #084f61 100%);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    position:relative; overflow:hidden;
  }
  .glow { position:absolute; border-radius:50%; filter:blur(45px); opacity:.5; }
  .g1 { width:320px; height:320px; background:#99f6e4; top:-70px; left:50%; transform:translateX(-50%); }
  .ring {
    width:270px; height:270px; border-radius:50%;
    background: linear-gradient(145deg, rgba(255,255,255,.30), rgba(255,255,255,.06));
    border:2px solid rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 20px 60px rgba(0,40,50,.35), inset 0 3px 16px rgba(255,255,255,.45);
    position:relative; z-index:2;
  }
  .ring svg { width:200px; height:200px; }
  .brand { margin-top:30px; text-align:center; z-index:2; }
  .brand .en { font-size:42px; font-weight:800; color:#fff; letter-spacing:1px; text-shadow:0 2px 10px rgba(0,40,50,.35); }
  .brand .zh { margin-top:6px; font-size:19px; font-weight:600; color:rgba(255,255,255,.92); letter-spacing:6px; }
  .tag { margin-top:12px; font-size:14px; color:rgba(255,255,255,.78); letter-spacing:3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow g1"></div>
    <div class="ring">
      <svg viewBox="0 0 100 100" fill="none">
        <!-- C letter -->
        <path d="M74 50 C74 32 60 20 44 20 C28 20 16 32 16 50 C16 68 28 80 44 80 C60 80 74 68 74 50 Z M62 50 C62 41 55 34 46 34 C37 34 30 41 30 50 C30 59 37 66 46 66 C55 66 62 59 62 50 Z"
              fill="rgba(255,255,255,.95)"/>
        <!-- globe dot inside C -->
        <circle cx="50" cy="50" r="9" fill="#0e7490"/>
        <path d="M47 47 a3 3 0 0 0 -3 3 M53 47 a3 3 0 0 1 3 3 M47 53 a3 3 0 0 1 -3 3 M53 53 a3 3 0 0 0 3 3" stroke="rgba(255,255,255,.85)" stroke-width="1.2" fill="none"/>
      </svg>
    </div>
    <div class="brand">
      <div class="en">ChinaEase</div>
      <div class="zh">华易通</div>
      <div class="tag">外国人来华服务</div>
    </div>
  </div>
</body>
</html>
