<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1440px; }
  body {
    width:1080px; height:1440px;
    font-family:"PingFang SC","Hiragino Sans GB","STHeiti",-apple-system,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.24), transparent 38%),
      radial-gradient(circle at 88% 88%, rgba(255,255,255,.16), transparent 42%),
      linear-gradient(155deg,#0ea5e9 0%,#14b8a6 52%,#0d9488 100%);
    color:#fff;
    display:flex; flex-direction:column;
    padding:68px 64px 56px;
  }
  .top-head {
    align-self:flex-start;
    background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(8px);
    font-size:27px; font-weight:700; letter-spacing:1px;
    padding:14px 28px; border-radius:999px;
  }
  .title { margin-top:26px; font-size:72px; font-weight:800; line-height:1.08; text-shadow:0 5px 20px rgba(0,0,0,.16); }
  .sub { margin-top:14px; font-size:28px; opacity:.95; font-weight:500; }
  .block {
    margin-top:30px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.34);
    backdrop-filter:blur(8px); border-radius:24px; padding:24px 28px;
  }
  .block .bh { font-size:31px; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid rgba(255,255,255,.18); }
  .row:last-child { border-bottom:none; }
  .row .l { font-size:26px; font-weight:600; }
  .row .l small { display:block; font-size:19px; opacity:.82; font-weight:400; margin-top:3px; }
  .row .p { font-size:30px; font-weight:800; color:#ffe27a; }
  .pkg { margin-top:14px; display:flex; justify-content:space-between; align-items:center;
         background:rgba(255,255,255,.26); border-radius:16px; padding:14px 20px; }
  .pkg .l { font-size:27px; font-weight:700; }
  .pkg .p { font-size:32px; font-weight:800; color:#ffe27a; }
  .qr-card {
    margin-top:auto; margin-bottom:18px;
    background:rgba(255,255,255,.94); border-radius:26px; padding:24px 30px;
    display:flex; align-items:center; gap:26px; box-shadow:0 18px 50px rgba(0,0,0,.28);
  }
  .qr-card img { width:188px; height:188px; border-radius:16px; display:block; }
  .qr-card .qt { color:#0f172a; text-align:left; }
  .qr-card .qt b { font-size:32px; display:block; }
  .qr-card .qt .wx { font-size:24px; color:#0d9488; font-weight:700; }
  .qr-card .qt small { font-size:20px; color:#475569; display:block; margin-top:8px; line-height:1.5; }
  .foot { text-align:center; font-size:21px; opacity:.92; }
</style>
</head>
<body>
  <div class="top-head">💎 付费服务 · 帮你省心落地</div>
  <div class="title">花钱买省心<br>落地有人管</div>
  <div class="sub">先服务 · 微信付款后人工对接</div>

  <div class="block">
    <div class="bh">📘 HSK 付费教材</div>
    <div class="row"><div class="l">HSK 1 标准教程 <small>在线浏览 + 下载</small></div><div class="p">¥19.9</div></div>
    <div class="row"><div class="l">HSK 2 标准教程 <small>在线浏览 + 下载</small></div><div class="p">¥24.9</div></div>
  </div>

  <div class="block">
    <div class="bh">🤝 求职管家（5 项）</div>
    <div class="row"><div class="l">简历翻译（中英 / ATS）</div><div class="p">¥199</div></div>
    <div class="row"><div class="l">对接雇主约面</div><div class="p">¥599</div></div>
    <div class="row"><div class="l">面试谈薪福利</div><div class="p">¥399</div></div>
    <div class="row"><div class="l">面试后租房</div><div class="p">¥499</div></div>
    <div class="row"><div class="l">签证办理（Z / K）</div><div class="p">¥899</div></div>
    <div class="pkg"><div class="l">🎁 全包套餐</div><div class="p">¥1,999</div></div>
  </div>

  <div class="qr-card">
    <img src="../assets/img/wechat-qr.jpg" alt="微信二维码">
    <div class="qt">
      <b>扫码加微信</b>
      <span class="wx">微信：yc</span>
      <small>微信付款 → 截图发 yc<br>→ 发兑换码解锁</small>
    </div>
  </div>

  <div class="foot">付款后人工发货 · 资料解锁即用</div>
</body>
</html>
