<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1440px; }
  body {
    width:1080px; height:1440px;
    font-family:"PingFang SC","Hiragino Sans GB","STHeiti",-apple-system,sans-serif;
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.28), transparent 38%),
      radial-gradient(circle at 86% 82%, rgba(255,255,255,.20), transparent 42%),
      linear-gradient(155deg,#0ea5e9 0%,#14b8a6 52%,#0d9488 100%);
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding:74px 66px 56px;
    position:relative; overflow:hidden;
  }
  .top-tag {
    display:inline-flex; align-items:center; gap:12px;
    background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(8px);
    padding:15px 30px; border-radius:999px;
    font-size:27px; font-weight:600; letter-spacing:1px;
  }
  h1 {
    margin-top:44px; font-size:98px; font-weight:800; line-height:1.04;
    text-shadow:0 6px 26px rgba(0,0,0,.18);
  }
  .brand {
    margin-top:24px; font-size:40px; font-weight:700; letter-spacing:5px;
    background:rgba(255,255,255,.18); padding:13px 32px; border-radius:18px;
    border:1px solid rgba(255,255,255,.38);
  }
  .slogan { margin-top:20px; font-size:30px; font-weight:500; opacity:.96; }
  .services {
    margin-top:50px; display:flex; gap:18px; flex-wrap:wrap; justify-content:center;
  }
  .svc {
    display:flex; flex-direction:column; align-items:center; gap:11px;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.36);
    backdrop-filter:blur(6px);
    padding:23px 16px; border-radius:22px; width:171px;
  }
  .svc .ico { font-size:48px; line-height:1; }
  .svc .lb { font-size:25px; font-weight:600; }
  .spacer { margin-top:auto; }
  .qr-card {
    margin-bottom:26px;
    background:rgba(255,255,255,.94); border-radius:28px; padding:26px 32px;
    display:flex; align-items:center; gap:28px; box-shadow:0 18px 50px rgba(0,0,0,.28);
  }
  .qr-card img { width:206px; height:206px; border-radius:16px; display:block; }
  .qr-card .qt { color:#0f172a; text-align:left; }
  .qr-card .qt b { font-size:35px; display:block; }
  .qr-card .qt .wx { font-size:25px; color:#0d9488; font-weight:700; }
  .qr-card .qt small { font-size:21px; color:#475569; display:block; margin-top:10px; line-height:1.5; }
  .url-bar {
    width:100%; background:rgba(255,255,255,.92); border-radius:999px;
    padding:21px 28px; color:#0f172a; font-size:23px; font-weight:600;
    text-align:center; letter-spacing:.3px; box-shadow:0 12px 30px rgba(0,0,0,.2);
    word-break:break-all;
  }
  .foot { margin-top:20px; font-size:22px; opacity:.92; }
</style>
</head>
<body>
  <div class="top-tag">🌏 外国人来华必备神器</div>
  <h1>来华不用慌</h1>
  <div class="brand">ChinaEase · 华易通</div>
  <div class="slogan">你的中文学习 &amp; 落地生活管家</div>

  <div class="services">
    <div class="svc"><div class="ico">📚</div><div class="lb">语言学习</div></div>
    <div class="svc"><div class="ico">🧳</div><div class="lb">游玩攻略</div></div>
    <div class="svc"><div class="ico">🛍️</div><div class="lb">购物支付</div></div>
    <div class="svc"><div class="ico">💼</div><div class="lb">找工作</div></div>
    <div class="svc"><div class="ico">🏥</div><div class="lb">医院陪诊</div></div>
  </div>

  <div class="spacer"></div>

  <div class="qr-card">
    <img src="../assets/img/wechat-qr.jpg" alt="微信二维码">
    <div class="qt">
      <b>扫码加微信</b>
      <span class="wx">微信：yc</span>
      <small>备注「来华咨询」<br>或直接在浏览器打开网站</small>
    </div>
  </div>

  <div class="url-bar">tachikomaver2-ship-it.github.io/china-services</div>
  <div class="foot">中英双语 · 手机 / 电脑 / 微信内皆可打开</div>
</body>
</html>
