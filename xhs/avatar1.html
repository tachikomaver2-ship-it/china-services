<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; }
  .wrap {
    width:600px; height:600px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(120% 120% at 30% 20%, #34d8c8 0%, #11b3c4 38%, #0e7490 72%, #0b5566 100%);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    position:relative; overflow:hidden;
  }
  .glow { position:absolute; border-radius:50%; filter:blur(40px); opacity:.55; }
  .g1 { width:300px; height:300px; background:#a7f3e4; top:-60px; right:-40px; }
  .g2 { width:240px; height:240px; background:#0ea5e9; bottom:-50px; left:-40px; opacity:.5; }
  .bubble {
    width:230px; height:230px; border-radius:50%;
    background: rgba(255,255,255,.16);
    border: 1.5px solid rgba(255,255,255,.45);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 18px 50px rgba(0,40,50,.35), inset 0 2px 12px rgba(255,255,255,.4);
    position:relative; z-index:2;
  }
  .bubble svg { width:150px; height:150px; }
  .brand { margin-top:30px; text-align:center; z-index:2; }
  .brand .en { font-size:42px; font-weight:800; color:#fff; letter-spacing:1px; text-shadow:0 2px 10px rgba(0,40,50,.35); }
  .brand .zh { margin-top:6px; font-size:19px; font-weight:600; color:rgba(255,255,255,.92); letter-spacing:6px; }
  .tag { margin-top:12px; font-size:14px; color:rgba(255,255,255,.78); letter-spacing:3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="bubble">
      <svg viewBox="0 0 100 100" fill="none">
        <!-- chat bubble -->
        <path d="M18 22 C18 16 22 13 28 13 L72 13 C78 13 82 16 82 22 L82 58 C82 64 78 67 72 67 L40 67 L26 80 L28 67 L28 67 C22 67 18 64 18 58 Z"
              fill="rgba(255,255,255,.92)" stroke="rgba(255,255,255,.95)" stroke-width="1.5"/>
        <!-- globe inside -->
        <circle cx="50" cy="40" r="14" fill="none" stroke="#0e7490" stroke-width="2.2"/>
        <ellipse cx="50" cy="40" rx="6" ry="14" fill="none" stroke="#0e7490" stroke-width="2.2"/>
        <line x1="36" y1="40" x2="64" y2="40" stroke="#0e7490" stroke-width="2.2"/>
        <path d="M37 33 H63 M37 47 H63" stroke="#0e7490" stroke-width="1.6"/>
        <!-- pin -->
        <path d="M82 60 c0 -6 5 -10 5 -10 s5 4 5 10 c0 5 -5 12 -5 12 s-5 -7 -5 -12 z" fill="#f97316" stroke="#fff" stroke-width="1.5"/>
        <circle cx="87" cy="60" r="2.6" fill="#fff"/>
      </svg>
    </div>
    <div class="brand">
      <div class="en">ChinaEase</div>
      <div class="zh">华易通</div>
      <div class="tag">外国人来华服务</div>
    </div>
  </div>
</body>
</html>
