<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; }
  .wrap {
    width:600px; height:600px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(120% 120% at 70% 25%, #2dd4bf 0%, #0ea5b7 40%, #0d6e8c 75%, #0a4f63 100%);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    position:relative; overflow:hidden;
  }
  .glow { position:absolute; border-radius:50%; filter:blur(40px); opacity:.5; }
  .g1 { width:280px; height:280px; background:#5eead4; top:-50px; left:-30px; }
  .g2 { width:220px; height:220px; background:#38bdf8; bottom:-40px; right:-30px; opacity:.5; }
  .card {
    width:250px; height:250px; border-radius:38px;
    background: rgba(255,255,255,.15);
    border:1.5px solid rgba(255,255,255,.45);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 18px 50px rgba(0,40,50,.32), inset 0 2px 12px rgba(255,255,255,.4);
    position:relative; z-index:2;
  }
  .card svg { width:170px; height:170px; }
  .brand { margin-top:30px; text-align:center; z-index:2; }
  .brand .en { font-size:42px; font-weight:800; color:#fff; letter-spacing:1px; text-shadow:0 2px 10px rgba(0,40,50,.35); }
  .brand .zh { margin-top:6px; font-size:19px; font-weight:600; color:rgba(255,255,255,.92); letter-spacing:6px; }
  .tag { margin-top:12px; font-size:14px; color:rgba(255,255,255,.78); letter-spacing:3px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="card">
      <svg viewBox="0 0 120 120" fill="none">
        <!-- simplified China map blob -->
        <path d="M30 28 C40 20 55 18 64 22 C72 18 84 20 88 30 C96 34 92 46 86 50 C90 58 84 66 76 64 C74 74 64 78 58 72 C50 78 40 74 40 64 C30 64 26 54 32 48 C26 42 26 34 30 28 Z"
              fill="rgba(255,255,255,.92)" stroke="rgba(255,255,255,.95)" stroke-width="1.5"/>
        <!-- pin on map -->
        <path d="M62 46 c0 -7 6 -12 6 -12 s6 5 6 12 c0 6 -6 14 -6 14 s-6 -8 -6 -14 z" fill="#f97316" stroke="#fff" stroke-width="1.6"/>
        <circle cx="68" cy="46" r="3" fill="#fff"/>
        <!-- orbit -->
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="4 6"/>
      </svg>
    </div>
    <div class="brand">
      <div class="en">ChinaEase</div>
      <div class="zh">华易通</div>
      <div class="tag">外国人来华服务</div>
    </div>
  </div>
</body>
</html>
