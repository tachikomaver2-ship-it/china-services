<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1440px; }
  body {
    width:1080px; height:1440px;
    font-family:"PingFang SC","Hiragino Sans GB","STHeiti",-apple-system,sans-serif;
    background:
      radial-gradient(circle at 85% 8%, rgba(20,184,166,.14), transparent 40%),
      linear-gradient(160deg,#e0f7fa 0%,#f0fdff 48%,#ccfbf1 100%);
    color:#0f172a;
    display:flex; flex-direction:column;
    padding:70px 64px 56px;
  }
  .top-head {
    align-self:flex-start;
    background:linear-gradient(120deg,#0ea5e9,#14b8a6);
    color:#fff; font-size:27px; font-weight:700; letter-spacing:1px;
    padding:15px 30px; border-radius:999px;
    box-shadow:0 12px 28px rgba(13,148,136,.28);
  }
  .title { margin-top:34px; font-size:74px; font-weight:800; line-height:1.08; color:#0f3a4d; }
  .sub { margin-top:18px; font-size:29px; color:#0f766e; font-weight:600; }
  .items { margin-top:42px; display:flex; flex-direction:column; gap:20px; }
  .item {
    display:flex; align-items:center; gap:26px;
    background:rgba(255,255,255,.86); border:1px solid rgba(255,255,255,.9);
    backdrop-filter:blur(6px);
    border-radius:24px; padding:26px 30px;
    box-shadow:0 14px 34px rgba(13,148,136,.14);
  }
  .item .ico {
    flex:0 0 auto; width:96px; height:96px; border-radius:22px;
    display:flex; align-items:center; justify-content:center; font-size:52px;
    background:linear-gradient(135deg,#e0f2fe,#ccfbf1);
  }
  .item .txt b { font-size:36px; font-weight:800; color:#0f3a4d; display:block; }
  .item .txt span { font-size:25px; color:#475569; display:block; margin-top:8px; line-height:1.5; }
  .item .txt .pay { color:#0d9488; font-weight:700; }
  .foot { margin-top:auto; text-align:center; font-size:24px; color:#0f766e; font-weight:600; }
</style>
</head>
<body>
  <div class="top-head">一个网站 = 来华 5 件事</div>
  <div class="title">来华生活<br>一个网站就搞定</div>
  <div class="sub">免费浏览 · 中英双语 · 手机就能看</div>

  <div class="items">
    <div class="item">
      <div class="ico">📚</div>
      <div class="txt"><b>语言学习</b><span>HSK 1–6 等级体系；付费标准教材 ¥19.9 起，在线浏览+下载</span></div>
    </div>
    <div class="item">
      <div class="ico">🧳</div>
      <div class="txt"><b>游玩攻略</b><span>热门目的地、高铁 / 签证 / 必备 App 一站式贴士</span></div>
    </div>
    <div class="item">
      <div class="ico">🛍️</div>
      <div class="txt"><b>购物支付</b><span>主流电商平台 + 外国人支付宝 / 微信支付开通 4 步 + 退税</span></div>
    </div>
    <div class="item">
      <div class="ico">💼</div>
      <div class="txt"><b>找工作</b><span>外企在招职位（按城市 / 领域筛选）+ Z 工作签证指南</span></div>
    </div>
    <div class="item">
      <div class="ico">🏥</div>
      <div class="txt"><b>医院陪诊</b><span>就医陪同翻译、挂号与科室导航，人生地不熟也不慌</span></div>
    </div>
  </div>

  <div class="foot">部分教材 / 服务收费 · 付款后人工对接发货</div>
</body>
</html>
